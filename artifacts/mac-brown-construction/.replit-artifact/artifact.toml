kind = "web"
previewPath = "/mac-brown-construction/"
title = "Mac Brown Construction"
version = "1.0.0"
id = "artifacts/mac-brown-construction"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/mac-brown-construction/" ]
localPort = 22777

[services.development]
run = "pnpm --filter @workspace/mac-brown-construction run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mac-brown-construction", "run", "build" ]
publicDir = "artifacts/mac-brown-construction/out"
serve = "static"

[services.env]
PORT = "22777"
BASE_PATH = "/mac-brown-construction/"
