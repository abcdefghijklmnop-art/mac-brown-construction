<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FFGS Certificate Editor</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0ede8;padding:24px;}
  h1{font-size:18px;font-weight:500;color:#1a1a1a;margin-bottom:16px;}
  .cert-wrap{position:relative;width:100%;max-width:900px;margin:0 auto 20px;}
  .cert-img{width:100%;display:block;border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.14);}
  .overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
  .f-acknowledges{position:absolute;top:27.5%;left:50%;transform:translateX(-50%);font-size:1.05vw;color:#555;font-family:Georgia,serif;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap;}
  .f-name{position:absolute;top:32.5%;left:50%;transform:translateX(-50%);width:65%;text-align:center;font-size:2.7vw;font-weight:700;color:#1a1a1a;font-family:Georgia,serif;letter-spacing:.03em;white-space:nowrap;overflow:hidden;}
  .f-separator{position:absolute;top:38.5%;left:50%;transform:translateX(-50%);width:80px;height:2px;background:#555;}
  .f-completed{position:absolute;top:41%;left:50%;transform:translateX(-50%);font-size:1.05vw;color:#555;font-family:Georgia,serif;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap;}
  .f-course{position:absolute;top:46%;left:50%;transform:translateX(-50%);width:70%;text-align:center;font-size:2.2vw;font-weight:600;color:#1a1a1a;font-family:Georgia,serif;white-space:nowrap;overflow:hidden;}
  .f-date{position:absolute;top:57%;left:50%;transform:translateX(-50%);width:60%;text-align:center;font-size:1.1vw;color:#333;font-family:Georgia,serif;letter-spacing:.04em;white-space:nowrap;}
  .controls{background:#fff;border-radius:10px;padding:20px;max-width:900px;margin:0 auto;border:1px solid #ddd;}
  .fr{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:10px;margin-bottom:12px;}
  label{font-size:13px;color:#666;font-weight:500;}
  input[type=text]{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;outline:none;font-family:inherit;}
  input[type=text]:focus{border-color:#888;}
  .btns{display:flex;gap:10px;margin-top:16px;}
  button{padding:9px 20px;border-radius:6px;border:1px solid #ccc;background:#fff;font-size:14px;cursor:pointer;font-family:inherit;}
  button:hover{background:#f5f5f5;}
  .btn-dl{background:#1a1a1a;color:#fff;border-color:#1a1a1a;flex:1;}
  .btn-dl:hover{background:#333;}
  .note{font-size:12px;color:#999;margin-top:10px;text-align:center;}
</style>
</head>

  <div class="fr">
    <label for="inpName">Recipient name</label>
    <input type="text" id="inpName" placeholder="Full name" value="Student Name" />
  </div>

    <input type="text" id="inpCourse" placeholder="Course title" value="Fly Fishing Guide Rowing School" />

    <input type="text" id="inpDate" placeholder="e.g. May 17, 2026" value="" />
  </div>

    <button class="btn-dl" onclick="downloadCert()">&#8595;&nbsp; Download certificate (JPG)</button>

<script>
var inpName=document.getElementById('inpName');
var inpCourse=document.getElementById('inpCourse');
var inpDate=document.getElementById('inpDate');
var dispName=document.getElementById('dispName');
var dispCourse=document.getElementById('dispCourse');
var dispDate=document.getElementById('dispDate');

function upd(){
  dispName.textContent=inpName.value.trim()||'Student Name';
  dispCourse.textContent=inpCourse.value.trim()||'Course Title';
  var d=inpDate.value.trim();
  dispDate.textContent=d?'Date: '+d:'Date: _______________________________';
}
inpName.addEventListener('input',upd);
inpCourse.addEventListener('input',upd);
inpDate.addEventListener('input',upd);

function resetAll(){
  inpName.value='Student Name';
  inpCourse.value='Fly Fishing Guide Rowing School';
  inpDate.value='';
  upd();
}

function downloadCert(){
  var canvas=document.createElement('canvas');
  var img=document.getElementById('certImg');
  var W=img.naturalWidth||2200;
  var H=img.naturalHeight||1700;
  canvas.width=W; canvas.height=H;
  var ctx=canvas.getContext('2d');
  var tmp=new Image();
  tmp.onload=function(){
    ctx.drawImage(tmp,0,0,W,H);
    ctx.textAlign='center';

    // "THIS ACKNOWLEDGES THAT"
    ctx.fillStyle='#555555';
    ctx.font=Math.round(W*.014)+'px Georgia,serif';
    ctx.letterSpacing='8px';
    ctx.fillText('THIS ACKNOWLEDGES THAT',W*.5,H*.295);

    // Name
    ctx.fillStyle='#1a1a1a';
    ctx.font='bold '+Math.round(W*.036)+'px Georgia,serif';
    ctx.fillText(inpName.value.trim()||'Student Name',W*.5,H*.358);

    // Separator line
    ctx.strokeStyle='#555555';
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(W*.41,H*.397); ctx.lineTo(W*.59,H*.397); ctx.stroke();

    // "HAS SUCCESSFULLY COMPLETED THE"
    ctx.fillStyle='#555555';
    ctx.font=Math.round(W*.014)+'px Georgia,serif';
    ctx.fillText('HAS SUCCESSFULLY COMPLETED THE',W*.5,H*.428);

    // Course title
    ctx.fillStyle='#1a1a1a';
    ctx.font='bold '+Math.round(W*.03)+'px Georgia,serif';
    ctx.fillText(inpCourse.value.trim()||'Course Title',W*.5,H*.497);

    // Date
    ctx.fillStyle='#333333';
    ctx.font=Math.round(W*.016)+'px Georgia,serif';
    var d=inpDate.value.trim();
    ctx.fillText(d?'Date: '+d:'Date: _______________________________',W*.5,H*.588);

    var a=document.createElement('a');
    a.download='FFGS_Certificate.jpg';
    a.href=canvas.toDataURL('image/jpeg',.95);
    a.click();
  };
  tmp.src=img.src;
}
</script>
